<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>jaceyln wu · 工作台</title>
<!-- PWA -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#4a3e4c" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="JW 工作台" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<style>
:root{
  --bg:#f6f4ef; --panel:#fefdfa; --ink:#3d3842; --muted:#9b8e9e;
  --line:#e9e4dc; --accent:#d9919d; --accent2:#aec78e; --accent3:#c48ba3;
  --good:#93b881; --warn:#d4a863; --bad:#cc7e6e;
  --shadow:0 6px 24px rgba(80,60,70,.07);
  --radius:16px;
  --c-qunxiang:#d9919d; --c-vlog:#ccad7e; --c-know:#aec78e;
  --c-work:#b89bc4; --c-study:#8db8a0; --c-other:#b0a5b8;
  --sidebar-bg:#4a3e4c; --sidebar-ink:#e8dfe6; --sidebar-dim:#aa9cb0;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif;
  background:var(--bg); color:var(--ink); overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
.app{display:grid; grid-template-columns:172px 1fr; height:100vh;}
/* ---------- Sidebar ---------- */
.side{background:linear-gradient(180deg,var(--sidebar-bg),#3d3240); color:var(--sidebar-ink); display:flex; flex-direction:column; padding:16px 10px; gap:3px; overflow-y:auto;}
.brand{display:flex; align-items:center; gap:8px; padding:4px 6px 14px;}
.brand .dot{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:14px;flex:none}
.brand b{font-size:14px;letter-spacing:.3px}
.brand small{display:block;color:var(--sidebar-dim);font-size:10px;font-weight:400;margin-top:1px}
.nav-item{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;color:#cfc3d4;cursor:pointer;font-size:12.5px;transition:.15s;user-select:none;white-space:nowrap}
.nav-item:hover{background:rgba(255,255,255,.05);color:#fff}
.nav-item.active{background:linear-gradient(135deg,rgba(217,145,157,.28),rgba(174,199,142,.22));color:#fff;font-weight:600}
.nav-item .ic{width:18px;text-align:center;font-size:15px;flex:none}
.nav-item .lb{flex:1;overflow:hidden;text-overflow:ellipsis}
.nav-foot{margin-top:auto;font-size:10px;color:#8a7d8f;line-height:1.6;padding:10px 4px 0;border-top:1px solid rgba(255,255,255,.07)}
/* ---------- Main ---------- */
.main{overflow-y:auto;padding:26px 32px 60px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px}
.topbar h1{font-size:22px;margin:0;font-weight:800}
.topbar .sub{color:var(--muted);font-size:13px;margin-top:4px}
.top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.clock{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);background:var(--panel);padding:8px 12px;border-radius:10px;box-shadow:var(--shadow)}
.pill{font-size:12px;background:var(--panel);padding:7px 12px;border-radius:20px;box-shadow:var(--shadow);color:var(--muted)}
.pill b{color:var(--accent3)}
section.view{display:none;animation:fade .25s ease}
section.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* ---------- Cards / grid ---------- */
.grid{display:grid;gap:18px}
.cols-2{grid-template-columns:1fr 1fr}
.cols-3{grid-template-columns:repeat(3,1fr)}
.cols-4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--panel);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card h3{margin:0 0 14px;font-size:15px;display:flex;align-items:center;gap:8px}
.card h3 .tag{margin-left:auto;font-size:11px;color:var(--muted);font-weight:400}
.muted{color:var(--muted)}
.small{font-size:12px}
/* stat */
.stat{position:relative;overflow:hidden}
.stat .num{font-size:30px;font-weight:800;line-height:1}
.stat .lbl{color:var(--muted);font-size:12px;margin-top:6px}
.stat .emo{position:absolute;right:14px;top:14px;font-size:26px;opacity:.18}
/* ---------- Forms ---------- */
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:#fcfbf8;border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);background:#fff}
textarea{resize:vertical;min-height:84px}
button{cursor:pointer;font-family:inherit;font-size:14px;border:none;border-radius:10px;padding:10px 16px;font-weight:600;transition:.15s}
.btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:#f3efe9;color:var(--ink)}
.btn.ghost:hover{background:#eae4da}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:8px}
.btn.danger{background:#e8dcd8;color:var(--bad)}
.btn.danger:hover{background:#ddcbc4}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1;min-width:120px}
.row .grow2{flex:2}
/* ---------- Tasks ---------- */
.task{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:#fcfbf8;border:1px solid var(--line);margin-bottom:9px;transition:.15s}
.task:hover{border-color:#dbd2c6}
.task .time{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent3);font-size:13px;min-width:46px}
.task .tt{flex:1}
.task .tt .cat{font-size:11px;color:var(--muted);margin-top:2px}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.chk{width:20px;height:20px;border-radius:6px;border:2px solid #d0c7bc;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px}
.task.done .chk{background:var(--good);border-color:var(--good)}
.chip{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;color:#fff;font-weight:600}
/* ---------- Charts ---------- */
.chart-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.legend{display:flex;flex-direction:column;gap:7px;font-size:13px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:8px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:11px;font-size:13px}
.bar .bl{width:96px;color:var(--muted);text-align:right;flex:none}
.bar .bt{flex:1;background:#efe9e0;border-radius:8px;height:22px;overflow:hidden}
.bar .bf{height:100%;border-radius:8px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#fff;font-size:11px;font-weight:700;min-width:30px}
/* ---------- Douyin ---------- */
.filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.fbtn{padding:6px 13px;border-radius:20px;background:#f3efe9;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;border:1px solid transparent}
.fbtn.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.idea{border:1px solid var(--line);border-radius:14px;padding:15px 16px;background:var(--panel);margin-bottom:12px;border-left:4px solid var(--accent)}
.idea h4{margin:0 0 7px;font-size:14px}
.idea .meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.idea p{margin:6px 0;font-size:13px;line-height:1.6}
.idea .k{color:var(--accent3);font-weight:700}
.theme{border:1px solid var(--line);border-radius:14px;padding:15px 16px;background:var(--panel);margin-bottom:12px}
.theme .ref{font-size:12px;color:var(--muted);margin:6px 0;font-style:italic}
.theme .adapt{font-size:13px;line-height:1.6;background:#faf4f6;padding:10px 12px;border-radius:10px;border-left:3px solid var(--accent)}
.saved{background:#f2f8ec!important;border-color:#c4dbb4!important}
/* ---------- Materials ---------- */
.note{border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:10px;background:var(--panel)}
.note h4{margin:0 0 4px;font-size:14px;display:flex;justify-content:space-between}
.note p{margin:0;font-size:13px;color:#5f5666;white-space:pre-wrap;line-height:1.6}
.note .when{font-size:11px;color:var(--muted)}
.bm{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--panel)}
.bm a{color:var(--accent3);text-decoration:none;font-weight:600;font-size:13px}
.bm a:hover{text-decoration:underline}
.bm .u{font-size:11px;color:var(--muted);margin-left:auto;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ---------- Review ---------- */
.rv{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--panel);margin-bottom:12px}
.rv .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px}
.rv .ttl{font-weight:700;font-size:14px}
.rv .mt{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.rv .blk{margin-top:8px;font-size:13px;line-height:1.6}
.rv .blk b{color:var(--accent3)}
/* ---------- Learning ---------- */
.ltab{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.lcard{display:block;border:1px solid var(--line);border-radius:14px;padding:14px 15px;background:var(--panel);margin-bottom:11px;text-decoration:none;color:inherit;transition:.15s;position:relative}
.lcard:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.lcard .lt{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.lcard .ld{font-size:12px;color:var(--muted);margin:5px 0}
.lcard .ltag{font-size:11px;background:#f3efe9;color:var(--muted);padding:2px 8px;border-radius:6px;margin-right:6px}
.lcard .del{position:absolute;top:8px;right:10px;width:22px;height:22px;border-radius:6px;background:#f3efe9;color:var(--muted);border:none;cursor:pointer;font-size:12px;display:none;align-items:center;justify-content:center;padding:0;font-weight:700}
.lcard:hover .del{display:flex}
.lcard .del:hover{background:#e8dcd8;color:var(--bad)}
.plat{font-size:11px;padding:2px 8px;border-radius:6px;margin-right:6px;color:#fff;font-weight:600}
.plat.B站{background:#d9919d}.plat.抖音{background:#3d3842}.plat.小红书{background:#cc7e6e}.plat.微信{background:#93b881}.plat.网页{background:#b0a5b8}
.searchbox{max-width:260px;flex:initial}
.pfilt{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0 18px}
.lcat{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.lcat .ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff}
/* inspiration */
.insp{background:linear-gradient(135deg,#fefdfa,#faf4f6);border:2px dashed var(--accent);border-radius:18px;padding:26px;text-align:center}
.insp .q{font-size:20px;font-weight:800;line-height:1.5}
.insp .a{color:var(--muted);margin-top:12px;font-size:14px}
.insp .tip{margin-top:16px;font-size:13px;color:var(--accent3);background:#faf4f6;padding:10px 14px;border-radius:10px;display:inline-block}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:#3d3842;color:#fff;padding:12px 20px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:24px}
.kpi-row{display:flex;gap:18px;flex-wrap:wrap}
/* ---------- modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(40,30,40,.4);z-index:100;display:flex;align-items:center;justify-content:center}
.modal-box{background:var(--panel);border-radius:var(--radius);padding:28px 32px;max-width:520px;width:90%;box-shadow:0 20px 60px rgba(40,30,40,.18);max-height:80vh;overflow-y:auto}
.modal-box h2{margin:0 0 16px;font-size:18px}
.modal-box .close{float:right;background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);padding:4px 8px;line-height:1}
/* ---------- report preview ---------- */
.rp-sect{margin-bottom:18px}
.rp-sect h4{font-size:14px;margin:0 0 6px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.rp-sect p{margin:3px 0;font-size:13px;line-height:1.7}
/* learn-add form */
.ln-add{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.ln-add input{flex:1;min-width:130px}
.ln-add select{width:auto;min-width:100px}
/* video case card */
.vcase{background:var(--panel);border-radius:12px;padding:16px 18px;border:1px solid var(--line);transition:.15s}
.vcase:hover{border-color:var(--accent);box-shadow:0 4px 16px rgba(217,145,157,.12)}
.vcase .vh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.vcase .vh h4{font-size:14px;margin:0;line-height:1.4}
.vcase .vdata{margin-bottom:6px}
.vcase .vdata span{font-size:12px;color:var(--accent);font-weight:600}
.vcase .vd{font-size:12px;line-height:1.7;margin:4px 0;color:var(--ink)}
.vcase .vl{margin-top:10px}
/* task tabs */
.task-tabs{display:flex;gap:8px;margin-bottom:18px}
/* calendar */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.cal-nav h2{font-size:18px;margin:0;color:var(--ink)}
.cal-grid{background:var(--panel);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line)}
.cal-header{display:grid;grid-template-columns:repeat(7,1fr);background:var(--sidebar-bg);color:var(--sidebar-ink)}
.cal-day-hd{text-align:center;padding:10px 4px;font-size:12px;font-weight:600}
.cal-row{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line)}
.cal-row:last-child{border-bottom:none}
.cal-cell{min-height:72px;padding:6px;border-right:1px solid var(--line);cursor:pointer;transition:.12s;position:relative}
.cal-cell:last-child{border-right:none}
.cal-cell.empty{background:var(--bg);cursor:default}
.cal-cell:hover:not(.empty){background:#fdf2f4}
.cal-cell.today{background:linear-gradient(135deg,rgba(217,145,157,.10),rgba(174,199,142,.08))}
.cal-cell.today .cal-num{background:var(--accent);color:#fff;border-radius:50%;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.cal-cell .cal-num{font-size:13px;color:var(--ink);display:inline-block;margin-bottom:4px}
.cal-cell.has-tasks .cal-dot{display:inline-block;font-size:10px;background:var(--accent2);color:#fff;border-radius:10px;padding:1px 7px;font-weight:600;margin-left:4px;vertical-align:top}
.cal-cell.has-tasks::after{content:'';position:absolute;bottom:6px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--accent2)}
@media(max-width:900px){.cols-2,.cols-3,.cols-4{grid-template-columns:1fr}.top-right{display:none}}@media(max-width:560px){.app{grid-template-columns:52px 1fr}.brand b,.brand small,.nav-item .lb{display:none}.nav-item{justify-content:center;padding:9px 6px}.brand .dot{width:26px;height:26px;font-size:12px}.cal-cell{min-height:48px}}
/* ---------- KPI / board / pomodoro / insp / learning cards ---------- */
.kpi-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.kpi-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi-card .num{font-size:28px;font-weight:800;line-height:1;color:var(--ink)}
.kpi-card .lbl{font-size:12px;color:var(--muted);margin-top:6px}
.kpi-card .emo{position:absolute;right:14px;top:12px;font-size:26px;opacity:.16}
.kpi-card:nth-child(1) .num{color:var(--accent)}
.kpi-card:nth-child(2) .num{color:var(--good)}
.kpi-card:nth-child(3) .num{color:var(--warn)}
.kpi-card:nth-child(4) .num{color:var(--accent3)}
.board-layout{display:grid;grid-template-columns:240px 1fr;gap:18px}
.preset-col .preset-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.preset-col h4{margin:0 0 12px;font-size:14px;color:var(--ink)}
.preset-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;background:#fcfbf8;border:1px solid var(--line);margin-bottom:8px;font-size:12.5px;cursor:pointer;transition:.12s}
.preset-item:hover{border-color:var(--accent);background:#fdf2f4}
.preset-item .pi-icon{font-size:15px}
.preset-item .pi-text{flex:1}
.preset-item .pi-add{color:var(--accent);font-size:16px;font-weight:700}
.board-area{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.board-col{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);min-height:220px}
.board-col h4{margin:0 0 14px;font-size:14px;display:flex;align-items:center;gap:8px}
.board-col h4 .count{margin-left:auto;font-size:12px;color:var(--muted);font-weight:400}
.task-card{border:1px solid var(--line);border-radius:12px;padding:13px;background:#fff;margin-bottom:10px;transition:.15s;position:relative}
.task-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.task-card .tc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.task-card .tc-time{font-size:12px;font-weight:700;color:var(--accent3)}
.task-card .tc-title{font-size:13.5px;font-weight:700;line-height:1.45;margin-bottom:8px}
.task-card .tc-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.task-card .tc-actions{display:flex;gap:6px;flex-wrap:wrap}
.task-card .tc-actions button{font-size:11px;padding:5px 9px;border-radius:7px}
.task-card.done{opacity:.72;background:#f8f9f6}
.task-card.done .tc-title{text-decoration:line-through;color:var(--muted)}
.task-card .tc-pomo{font-size:11px;color:var(--muted)}
.scheduled-list{margin-top:14px}
.scheduled-item{font-size:12px;padding:8px 10px;border-radius:8px;background:#fff7f0;border:1px solid #f2e0d0;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.scheduled-item .sd-date{color:var(--warn);font-weight:700}
/* pomodoro overlay */
.pomo-overlay{position:fixed;inset:0;background:linear-gradient(135deg,#4a3e4c,#3d3240);z-index:200;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px}
.pomo-quote{font-size:18px;line-height:1.7;max-width:520px;margin-bottom:40px;opacity:.9;font-weight:300}
.pomo-task{font-size:16px;color:#e8dfe6;margin-bottom:20px}
.pomo-task b{color:#fff}
.pomo-time{font-size:96px;font-weight:200;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-2px;margin-bottom:12px}
.pomo-mode{font-size:14px;color:#aa9cb0;margin-bottom:40px;text-transform:uppercase;letter-spacing:2px}
.pomo-controls{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap}
.pomo-controls button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:50%;width:56px;height:56px;display:flex;align-items:center;justify-content:center;font-size:20px;padding:0;transition:.15s}
.pomo-controls button:hover{background:rgba(255,255,255,.22)}
.pomo-controls .pomo-main{width:80px;height:80px;font-size:32px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none}
.pomo-controls .pomo-main:hover{filter:brightness(1.08)}
.pomo-close{position:absolute;top:20px;right:24px;background:none;border:none;color:#aa9cb0;font-size:24px;cursor:pointer;padding:8px}
.pomo-settings{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:12px;align-items:center;color:#aa9cb0;font-size:12px}
.pomo-settings input{width:60px;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);padding:6px;border-radius:8px;text-align:center}
/* inspiration cards */
.insp-header{background:linear-gradient(135deg,#fefdfa,#faf4f6);border:2px dashed var(--accent);border-radius:18px;padding:22px;text-align:center;margin-bottom:20px}
.insp-header h3{margin:0 0 8px;font-size:17px}
.insp-header p{margin:0;font-size:13px;color:var(--muted)}
.insp-list{display:flex;flex-direction:column;gap:14px}
.insp-card{border:1px solid var(--line);border-radius:16px;padding:18px;background:var(--panel);box-shadow:var(--shadow);transition:.15s}
.insp-card:hover{border-color:var(--accent)}
.insp-card .ic-title{font-size:15px;font-weight:800;line-height:1.45;margin-bottom:8px}
.insp-card .ic-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.insp-card .ic-tag{font-size:11px;padding:3px 10px;border-radius:20px;background:#f3efe9;color:var(--muted);font-weight:600}
.insp-card .ic-desc{font-size:13px;color:#5f5666;line-height:1.7;margin-bottom:12px}
.insp-card .ic-actions{display:flex;gap:8px;flex-wrap:wrap}
.insp-card .ic-actions button{font-size:12px;padding:7px 13px;border-radius:8px}
.insp-card .ic-actions .btn-ghost{background:#f3efe9;color:var(--ink)}
.insp-card .ic-actions .btn-ghost:hover{background:#eae4da}
/* learning resource cards */
.res-list{display:flex;flex-direction:column;gap:14px}
.res-card2{border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--panel);box-shadow:var(--shadow);transition:.15s}
.res-card2:hover{border-color:var(--accent);transform:translateY(-2px)}
.res-card2 .rc-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.res-card2 .rc-title{font-size:15px;font-weight:800;margin-bottom:6px}
.res-card2 .rc-desc{font-size:13px;color:#5f5666;line-height:1.6;margin-bottom:12px}
.res-card2 .rc-thumb{background:var(--bg);border-radius:12px;height:140px;display:flex;align-items:center;justify-content:center;flex-direction:column;margin-bottom:12px;overflow:hidden;border:1px solid var(--line);position:relative}
.res-card2 .rc-thumb .rc-plat-ico{font-size:48px;opacity:.25}
.res-card2 .rc-thumb .rc-plat-name{font-size:13px;color:var(--muted);margin-top:6px}
.res-card2 .rc-meta{font-size:11px;color:var(--muted);position:absolute;bottom:8px;left:12px}
.res-card2 .rc-actions{display:flex;gap:8px;flex-wrap:wrap}
.res-card2 .rc-actions button{font-size:12px;padding:7px 12px;border-radius:8px}
.res-card2 .rc-actions .btn-ghost{background:#f3efe9;color:var(--ink)}
.res-card2 .rc-actions .btn-ghost:hover{background:#eae4da}
@media(max-width:900px){.kpi-bar{grid-template-columns:repeat(2,1fr)}.board-layout{grid-template-columns:1fr}.board-area{grid-template-columns:1fr}.preset-col{order:2}}
@media(max-width:560px){.kpi-bar{grid-template-columns:1fr 1fr}.pomo-time{font-size:64px}.pomo-quote{font-size:15px}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="dot">JW</div>
      <div><b>jaceyln wu</b><small>工作台 · 抖音 122498939</small></div>
    </div>
    <div class="nav-item active" data-view="home"><span class="ic">🏠</span><span class="lb">今日概览</span></div>
    <div class="nav-item" data-view="tasks"><span class="ic">✅</span><span class="lb">每日任务</span></div>
    <div class="nav-item" data-view="efficiency"><span class="ic">📊</span><span class="lb">效率统计</span></div>
    <div class="nav-item" data-view="materials"><span class="ic">🗂️</span><span class="lb">项目资料</span></div>
    <div class="nav-item" data-view="douyin"><span class="ic">🔥</span><span class="lb">爆款灵感</span></div>
    <div class="nav-item" data-view="review"><span class="ic">🔁</span><span class="lb">内容复盘</span></div>
    <div class="nav-item" data-view="inspiration"><span class="ic">💡</span><span class="lb">每日灵感</span></div>
    <div class="nav-item" data-view="learning"><span class="ic">📚</span><span class="lb">学习资料</span></div>
    <div class="nav-foot">
      数据保存在本机浏览器<br>更新于 <span id="footTime">—</span><br>
      <span style="color:var(--sidebar-dim)">双击 index.html 即可使用</span>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1 id="pageTitle">今日概览</h1>
        <div class="sub" id="pageSub">—</div>
      </div>
      <div class="top-right">
        <button class="btn ghost sm" onclick="openReport()">📄 导出周报/月报</button>
        <div class="pill">🎬 赛道：<b>群像/家庭友情 · 生活 · 知识 · 副业</b></div>
        <div class="clock" id="clock">--:--:--</div>
      </div>
    </div>

    <section class="view active" id="view-home"></section>
    <section class="view" id="view-tasks"></section>
    <section class="view" id="view-efficiency"></section>
    <section class="view" id="view-materials"></section>
    <section class="view" id="view-douyin"></section>
    <section class="view" id="view-review"></section>
    <section class="view" id="view-inspiration"></section>
    <section class="view" id="view-learning"></section>
  </main>
</div>
<div class="toast" id="toast"></div>

<script src="douyin_data.js"></script>
<script src="learning_data.js"></script>
<script>
/* =========================================================
 *  jaceyln wu 工作台 — 逻辑层
 * ========================================================= */
const CATS = [
  {id:'qunxiang',name:'群像/家庭友情',color:'var(--c-qunxiang)'},
  {id:'vlog',name:'生活Vlog',color:'var(--c-vlog)'},
  {id:'know',name:'知识/成长',color:'var(--c-know)'},
  {id:'work',name:'职场/副业',color:'var(--c-work)'},
  {id:'study',name:'学习/雅思',color:'var(--c-study)'},
  {id:'other',name:'其他',color:'var(--c-other)'},
];
const catName = id => (CATS.find(c=>c.id===id)||{}).name || '其他';
const catColor = id => (CATS.find(c=>c.id===id)||{}).color || 'var(--c-other)';

const LS = {
  get(k,def){ try{const v=localStorage.getItem('jw_'+k); return v?JSON.parse(v):def;}catch(e){return def;} },
  set(k,v){ localStorage.setItem('jw_'+k, JSON.stringify(v)); }
};
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const nowStr = () => { const d=new Date(); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
const esc = s => (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const escAttr = s => (s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\'':'&#39;','"':'&quot;'}[c]));
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);}

/* ---------- Date helpers ---------- */
function daysAgo(n){const d=new Date();d.setDate(d.getDate()-n);return fmtDate(d);}
function fmtDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function dateRange(days){const out=[];for(let i=days-1;i>=0;i--)out.push(daysAgo(i));return out;}
function weekStart(){const d=new Date();const dow=d.getDay()||7;d.setDate(d.getDate()-dow+1);return fmtDate(d);}
function monthStart(){const d=new Date();d.setDate(1);return fmtDate(d);}
/* calendar helpers */
function calYearMonth(d){return {year:d.getFullYear(),month:d.getMonth()+1};}
function calDaysInMonth(y,m){return new Date(y,m,0).getDate();}
function calFirstDow(y,m){const dow=new Date(y,m-1,1).getDay();return dow===0?7:dow;} // Mon=1..Sun=7
function calWeeks(y,m){const dim=calDaysInMonth(y,m);const fd=calFirstDow(y,m);return Math.ceil((dim+fd-1)/7);}
function fmtCalDate(y,m,d){return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}

/* ---------- Router ---------- */
const TITLES = {
  home:['今日概览','今天的状态、任务与灵感一览'],
  tasks:['每日任务 / 时间节点','规划今天要做的事，并绑定时间节点'],
  efficiency:['时间效率统计','记录你在各赛道投入的时间，看清效率'],
  materials:['项目资料','笔记、书签与灵感素材的统一收纳'],
  douyin:['抖音爆款灵感','和你赛道匹配的每日爆款、热点与二创角度'],
  review:['内容复盘','每次发完都记一笔，下次知道怎么优化'],
  inspiration:['每日灵感','每天一个内容角度，告别选题焦虑'],
  learning:['学习资料库','九大板块的精选学习资源']
};
document.querySelectorAll('.nav-item').forEach(el=>{
  el.addEventListener('click',()=>{
    document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
    el.classList.add('active');
    const v=el.dataset.view;
    document.querySelectorAll('section.view').forEach(s=>s.classList.remove('active'));
    document.getElementById('view-'+v).classList.add('active');
    document.getElementById('pageTitle').textContent=TITLES[v][0];
    document.getElementById('pageSub').textContent=TITLES[v][1];
    if(v==='home') renderHome();
    if(v==='tasks') renderTasks();
    if(v==='efficiency') renderEfficiency();
    if(v==='materials') renderMaterials();
    if(v==='douyin') renderDouyin();
    if(v==='review') renderReview();
    if(v==='inspiration') renderInspiration();
    if(v==='learning') renderLearning();
  });
});

/* =========================================================
 *  CLOCK
 * ========================================================= */
function tick(){const d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString('zh-CN',{hour12:false});}
setInterval(tick,1000); tick();
document.getElementById('footTime').textContent = (window.DOUYIN_DATA&&window.DOUYIN_DATA.updated)||today();

/* =========================================================
 *  HOME
 * ========================================================= */
function renderHome(){
  const tasks = LS.get('tasks',[]).filter(t=>t.date===today());
  const done = tasks.filter(t=>t.done).length;
  const blocks = LS.get('blocks',[]).filter(b=>b.date===today());
  const mins = blocks.reduce((s,b)=>s+(b.min||0),0);
  const reviews = LS.get('reviews',[]);
  const ideas = (window.DOUYIN_DATA&&window.DOUYIN_DATA.remixIdeas)||[];
  const pick = ideas.slice(0,3);
  document.getElementById('view-home').innerHTML = `
  <div class="grid cols-4" style="margin-bottom:18px">
    <div class="card stat"><div class="emo">✅</div><div class="num">${done}/${tasks.length}</div><div class="lbl">今日任务完成</div></div>
    <div class="card stat"><div class="emo">⏱️</div><div class="num">${mins}<span style="font-size:14px;color:var(--muted)"> 分</span></div><div class="lbl">今日已记录时长</div></div>
    <div class="card stat"><div class="emo">🔁</div><div class="num">${reviews.length}</div><div class="lbl">累计复盘条数</div></div>
    <div class="card stat"><div class="emo">🔥</div><div class="num">${(window.DOUYIN_DATA?window.DOUYIN_DATA.hotTopics.length:0)}</div><div class="lbl">今日匹配热点</div></div>
  </div>
  <div class="grid cols-2">
    <div class="card">
      <h3>📌 今日任务时间轴</h3>
      <div id="homeTasks"></div>
      <button class="btn ghost sm" onclick="document.querySelector('[data-view=tasks]').click()">去管理任务 →</button>
    </div>
    <div class="card">
      <h3>💡 今日推荐二创方向 <span class="tag">来自实时热榜</span></h3>
      ${pick.map(i=>`<div class="idea" style="margin-bottom:10px"><h4>${esc(i.title)}</h4><p><span class="k">钩子：</span>${esc(i.hook)}</p><p><span class="k">形式：</span>${esc(i.format)}</p></div>`).join('')||'<div class="empty">暂无数据</div>'}
      <button class="btn ghost sm" onclick="document.querySelector('[data-view=douyin]').click()">看全部爆款灵感 →</button>
    </div>
  </div>`;
  const ht = tasks.sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  document.getElementById('homeTasks').innerHTML = ht.length? ht.map(t=>`
    <div class="task ${t.done?'done':''}">
      <div class="time">${esc(t.time||'--:--')}</div>
      <div class="tt">${esc(t.title)}<div class="cat"><span class="chip" style="background:${catColor(t.cat)}">${catName(t.cat)}</span></div></div>
    </div>`).join('') : '<div class="empty">今天还没有任务，去添加吧</div>';
}

/* =========================================================
 *  TASKS — TRAEWork 式卡片看板 + 番茄钟 + 预置日课
 * ========================================================= */
let taskView='day'; // 'day' or 'month'
let taskCalYear=0, taskCalMonth=0;
let _viewDate = null; // 当前查看/编辑的日期

const DEFAULT_PRESETS = [
  {id:'p1', title:'🌅 晨间选题：刷抖音热点 + 选 1 个二创角度', cat:'qunxiang', time:'09:00'},
  {id:'p2', title:'📝 拆解爆款：看 2 条对标视频并记录', cat:'qunxiang', time:'10:00'},
  {id:'p3', title:'🎬 内容拍摄：按计划拍当日视频素材', cat:'vlog', time:'14:00'},
  {id:'p4', title:'✂️ 剪辑发布：粗剪 + 文案 + 封面', cat:'vlog', time:'16:00'},
  {id:'p5', title:'📚 学习充电：镜头语言 / 传播学 / 运营', cat:'know', time:'20:00'},
  {id:'p6', title:'🌍 英语学习：雅思单词 / 口语 / 听力', cat:'study', time:'21:00'},
  {id:'p7', title:'🔁 复盘记录：今日数据 + 明天计划', cat:'work', time:'22:00'}
];
function getPresets(){ return LS.get('presetTemplates', DEFAULT_PRESETS); }
function getPomoSettings(){ return LS.get('pomoSettings', {focus:25, break:5}); }

function renderTasks(){
  if(!taskCalYear){ const d=new Date(); taskCalYear=d.getFullYear(); taskCalMonth=d.getMonth()+1; }
  const date = _viewDate || today();

  if(taskView==='month'){
    document.getElementById('view-tasks').innerHTML = `
    <div class="task-tabs">
      <button class="fbtn ${taskView==='day'?'active':''}" onclick="taskView='day';renderTasks()">📅 每日计划</button>
      <button class="fbtn ${taskView==='month'?'active':''}" onclick="taskView='month';renderTasks()">🗓️ 每月计划</button>
    </div>
    ${renderMonthPlan()}`;
    drawMonthCal();
    return;
  }

  const tasks = LS.get('tasks',[]).filter(t=>t.date===date);
  const total=tasks.length, done=tasks.filter(t=>t.done).length, todo=total-done;
  const rate = total? Math.round(done/total*100) : 0;

  document.getElementById('view-tasks').innerHTML = `
  <div class="task-tabs">
    <button class="fbtn active" onclick="taskView='day';renderTasks()">📅 每日计划</button>
    <button class="fbtn" onclick="taskView='month';renderTasks()">🗓️ 每月计划</button>
    <button class="fbtn" onclick="openPomoSettings()">⚙️ 番茄钟设置</button>
  </div>

  <!-- KPI 概览 -->
  <div class="kpi-bar">
    <div class="kpi-card"><div class="emo">📋</div><div class="num">${total}</div><div class="lbl">今日任务</div></div>
    <div class="kpi-card"><div class="emo">✅</div><div class="num">${done}</div><div class="lbl">已完成</div></div>
    <div class="kpi-card"><div class="emo">⏳</div><div class="num">${todo}</div><div class="lbl">待完成</div></div>
    <div class="kpi-card"><div class="emo">📈</div><div class="num">${rate}%</div><div class="lbl">完成率</div></div>
  </div>

  <div class="board-layout">
    <!-- 左栏：个人日常 + 预定任务 -->
    <div class="preset-col">
      <div class="preset-card">
        <h4>🌟 个人日常 · 日课模板</h4>
        <div id="presetList"></div>
        <button class="btn ghost sm" style="margin-top:10px;width:100%" onclick="applyAllPresets()">全部添加到今日</button>
      </div>
      <div class="preset-card">
        <h4>📌 添加预定任务</h4>
        <div class="row" style="flex-direction:column;align-items:stretch;gap:8px">
          <input id="sTitle" placeholder="任务内容">
          <input id="sDate" type="date" value="${today()}">
          <input id="sTime" type="time" value="${nowStr()}">
          <select id="sCat">${CATS.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select>
          <button class="btn sm" onclick="addScheduledTask()">添加预定</button>
        </div>
      </div>
      <div class="preset-card">
        <h4>⏰ 即将到来的预定</h4>
        <div id="scheduledList"></div>
      </div>
    </div>

    <!-- 主区域：任务看板 -->
    <div class="board-area">
      <!-- 添加新任务 -->
      <div class="board-col" style="grid-column:span 3">
        <h4>➕ 添加任务 <span class="small muted">${date === today() ? '今日' : date}</span></h4>
        <div class="row" style="flex-wrap:nowrap">
          <input id="tTitle" placeholder="任务内容，如：和闺蜜拍『歌名文案』第3期" style="flex:2">
          <select id="tCat" style="width:130px;flex:none">${CATS.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select>
          <input id="tTime" type="time" value="${nowStr()}" style="width:110px;flex:none">
          <button class="btn" onclick="addTask()" style="flex:none">添加</button>
        </div>
      </div>

      <!-- 三列看板 -->
      <div class="board-col">
        <h4>🍅 进行中 <span class="count" id="colDoingCount">0</span></h4>
        <div id="colDoing"></div>
      </div>
      <div class="board-col">
        <h4>📌 待开始 <span class="count" id="colTodoCount">0</span></h4>
        <div id="colTodo"></div>
      </div>
      <div class="board-col">
        <h4>✅ 已完成 <span class="count" id="colDoneCount">0</span></h4>
        <div id="colDone"></div>
      </div>
    </div>
  </div>`;

  drawTaskBoard();
  drawPresets();
  drawScheduled();
  checkScheduledTasks();
}

function drawPresets(){
  const presets = getPresets();
  const el = document.getElementById('presetList');
  if(!el) return;
  el.innerHTML = presets.map(p=>`
    <div class="preset-item" onclick="addPresetTask('${p.id}')" title="点击添加到今日">
      <span class="pi-icon">${p.title.charAt(0)}</span>
      <span class="pi-text">${esc(p.title.slice(2))}<br><span class="small muted">${p.time} · ${catName(p.cat)}</span></span>
      <span class="pi-add">+</span>
    </div>`).join('');
}

function drawScheduled(){
  const tasks = LS.get('tasks',[]);
  const upcoming = tasks.filter(t=>t.date > today()).sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'').localeCompare(b.time||''));
  const el = document.getElementById('scheduledList');
  if(!el) return;
  el.innerHTML = upcoming.slice(0,5).map(t=>`
    <div class="scheduled-item">
      <span class="sd-date">${t.date.slice(5)}</span>
      <span style="flex:1">${esc(t.title)}</span>
      <button class="btn ghost sm" style="padding:3px 8px;font-size:11px" onclick="delTask('${t.id}')">删</button>
    </div>`).join('') || '<div class="empty" style="padding:12px">暂无预定任务</div>';
}

function addPresetTask(pid){
  const p = getPresets().find(x=>x.id===pid); if(!p) return;
  const tasks=LS.get('tasks',[]);
  tasks.push({id:uid(), title:p.title, cat:p.cat, time:p.time, date:today(), done:false, preset:true});
  LS.set('tasks',tasks);
  drawTaskBoard(); renderHome();
  toast(`已添加日课：${p.title.slice(2)}`);
}
function applyAllPresets(){
  const tasks=LS.get('tasks',[]);
  getPresets().forEach(p=>{
    if(!tasks.some(t=>t.date===today() && t.title===p.title)){
      tasks.push({id:uid(), title:p.title, cat:p.cat, time:p.time, date:today(), done:false, preset:true});
    }
  });
  LS.set('tasks',tasks);
  drawTaskBoard(); renderHome();
  toast('全部日课已添加');
}
function addScheduledTask(){
  const title=document.getElementById('sTitle').value.trim();
  if(!title){toast('先写任务内容');return;}
  const date=document.getElementById('sDate').value;
  if(!date || date < today()){toast('请选择今天或未来的日期');return;}
  const tasks=LS.get('tasks',[]);
  tasks.push({id:uid(), title, cat:document.getElementById('sCat').value, time:document.getElementById('sTime').value, date, done:false, scheduled:true});
  LS.set('tasks',tasks);
  document.getElementById('sTitle').value='';
  drawScheduled(); renderHome();
  toast('预定任务已添加');
}

function drawTaskBoard(){
  const date = _viewDate || today();
  const tasks = LS.get('tasks',[]).filter(t=>t.date===date).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  const doing = tasks.filter(t=>!t.done && (t.pomodoros||0)>0);
  const todo = tasks.filter(t=>!t.done && (!t.pomodoros||t.pomodoros===0));
  const done = tasks.filter(t=>t.done);

  document.getElementById('colDoing').innerHTML = doing.map(t=>taskCard(t)).join('') || '<div class="empty" style="padding:18px 0">点击任务开始专注</div>';
  document.getElementById('colTodo').innerHTML = todo.map(t=>taskCard(t)).join('') || '<div class="empty" style="padding:18px 0">还没有待开始任务</div>';
  document.getElementById('colDone').innerHTML = done.map(t=>taskCard(t)).join('') || '<div class="empty" style="padding:18px 0">还没有已完成任务</div>';

  document.getElementById('colDoingCount').textContent = doing.length;
  document.getElementById('colTodoCount').textContent = todo.length;
  document.getElementById('colDoneCount').textContent = done.length;
}

function taskCard(t){
  const pomoCount = t.pomodoros || 0;
  return `
    <div class="task-card ${t.done?'done':''}">
      <div class="tc-top">
        <span class="chip" style="background:${catColor(t.cat)}">${catName(t.cat)}</span>

      </div>
      <div class="tc-title">${esc(t.title)}</div>
      <div class="tc-meta">
        ${pomoCount?`<span class="tc-pomo">${'🍅'.repeat(Math.min(pomoCount,5))}${pomoCount>5?'+'+ (pomoCount-5):''}</span>`:''}
        ${t.scheduled?'<span class="tc-pomo">📌 预定</span>':''}
      </div>
      <div class="tc-actions">
        ${t.done?'':`<button class="btn" onclick="openPomodoro('${t.id}')">🍅 开始专注</button>`}

}

function addTask(){
  const title=document.getElementById('tTitle').value.trim();
  if(!title){toast('先写点任务内容');return;}
  const date = _viewDate || today();
  const tasks=LS.get('tasks',[]);

  document.getElementById('tTitle').value='';

function toggleTask(id){
  const t=LS.get('tasks',[]); const x=t.find(i=>i.id===id);

}
function delTask(id){
  LS.set('tasks',LS.get('tasks',[]).filter(i=>i.id!==id));
  drawTaskBoard(); drawScheduled(); renderHome();
  toast('已删除');
}

function checkScheduledTasks(){
  const notified = LS.get('scheduledNotified',[]);
  const tasks = LS.get('tasks',[]).filter(t=>t.scheduled && t.date===today() && !t.done && !notified.includes(t.id));
  tasks.forEach(t=>{
    if(t.time && t.time <= nowStr()){
      toast(`⏰ 预定任务到点：${t.title}`);
      notified.push(t.id);

/* ---- month plan ---- */
function renderMonthPlan(){
  const prevM = taskCalMonth===1 ? 12 : taskCalMonth-1;
  const prevY = taskCalMonth===1 ? taskCalYear-1 : taskCalYear;
  const nextM = taskCalMonth===12 ? 1 : taskCalMonth+1;
  const nextY = taskCalMonth===12 ? taskCalYear+1 : taskCalYear;

  return `
  <div class="cal-nav">
    <button class="btn ghost sm" onclick="taskCalYear=${prevY};taskCalMonth=${prevM};renderTasks()">◀ 上月</button>
    <h2>${taskCalYear}年 ${taskCalMonth}月</h2>
    <button class="btn ghost sm" onclick="taskCalYear=${nextY};taskCalMonth=${nextM};renderTasks()">下月 ▶</button>
  </div>
  <div class="cal-grid" id="calGrid"></div>
  <p style="text-align:center;margin-top:12px">
    <a href="#" onclick="taskView='day';_viewDate=null;renderTasks();return false" style="color:var(--accent)">📅 返回今日计划 →</a>
  </p>`;
}
function drawMonthCal(){
  const el = document.getElementById('calGrid'); if(!el) return;
  const y=taskCalYear, m=taskCalMonth;
  const dim = calDaysInMonth(y,m), fd = calFirstDow(y,m), weeks = calWeeks(y,m);
  const todayDate = today();
  const [ty,tm,td] = todayDate.split('-').map(Number);
  const allTasks = LS.get('tasks',[]);
  const taskMap = {};
  allTasks.forEach(t=>{ if(t.date) taskMap[t.date]=(taskMap[t.date]||0)+1; });
  const dayNames = ['一','二','三','四','五','六','日'];
  let html = '<div class="cal-header">'+dayNames.map(d=>`<div class="cal-day-hd">${d}</div>`).join('')+'</div>';
  let day=1;
  for(let w=0; w<weeks; w++){
    html += '<div class="cal-row">';
    for(let d=0; d<7; d++){
      if((w===0 && d<fd-1) || day>dim){
        html += '<div class="cal-cell empty"></div>';
      } else {
        const dateStr = fmtCalDate(y,m,day);
        const isToday = (y===ty && m===tm && day===td);
        const taskCount = taskMap[dateStr]||0;
        const cls = ['cal-cell', isToday?'today':'', taskCount>0?'has-tasks':''].filter(Boolean).join(' ');
        html += `<div class="${cls}" onclick="openDayPlan('${dateStr}')">
          <span class="cal-num">${day}</span>
          ${taskCount>0?`<span class="cal-dot">${taskCount}</span>`:''}
        </div>`;
        day++;
      }
    }
    html += '</div>';
  }
  el.innerHTML = html;
}
function openDayPlan(dateStr){
  taskView='day'; _viewDate=dateStr; renderTasks();
  setTimeout(()=>toast(`📅 查看 ${dateStr} 的任务`), 300);
}

/* ---- pomodoro ---- */
let pomoState = null; // {taskId, endAt, paused, totalSec, mode, iv}
const POMO_QUOTES = [
  "你只要尝试过飞，日后走路时也会仰望天空。因为那是你曾经到过，并渴望回去的地方。",
  "种一棵树最好的时间是十年前，其次是现在。",
  "专注不是一直做一件事，而是一次只做一件事。",
  "每一个番茄钟，都是在为未来的自己存一笔时间。",
  "此刻的专注，是下一条爆款的伏笔。"
];
function openPomodoro(taskId){
  const tasks=LS.get('tasks',[]); const t=tasks.find(i=>i.id===taskId); if(!t) return;
  stopExistingPomo();
  const s=getPomoSettings();
  pomoState = {taskId, mode:'focus', totalSec:s.focus*60, paused:false, endAt:Date.now()+s.focus*60000};
  renderPomodoroOverlay(t.title);
  pomoState.iv = setInterval(tickPomodoro, 1000);
}
function stopExistingPomo(){ if(pomoState){clearInterval(pomoState.iv); pomoState=null;} }
function renderPomodoroOverlay(taskTitle){
  const quote = POMO_QUOTES[Math.floor(Math.random()*POMO_QUOTES.length)];
  const overlay = document.createElement('div');
  overlay.className='pomo-overlay'; overlay.id='pomoOverlay';
  overlay.innerHTML = `
    <button class="pomo-close" onclick="stopPomodoro(false)">×</button>
    <div class="pomo-quote">“${quote}”</div>
    <div class="pomo-task">当前任务：<b>${esc(taskTitle)}</b></div>
    <div class="pomo-time" id="pomoTime">25:00</div>
    <div class="pomo-mode" id="pomoMode">专注中</div>
    <div class="pomo-controls">
      <button onclick="togglePomoPause()" id="pomoPauseBtn" title="暂停/继续">⏸</button>
      <button class="pomo-main" onclick="stopPomodoro(true)" title="完成专注">✓</button>
      <button onclick="resetPomo()" title="重置">↻</button>
    </div>
    <div class="pomo-settings">
      专注 <input type="number" id="pomoFocus" value="${getPomoSettings().focus}" min="1" max="120" onchange="savePomoSettings()"> 分
      休息 <input type="number" id="pomoBreak" value="${getPomoSettings().break}" min="1" max="60" onchange="savePomoSettings()"> 分
    </div>`;
  document.body.appendChild(overlay);
}
function tickPomodoro(){
  if(!pomoState || pomoState.paused) return;
  const left = Math.max(0, Math.ceil((pomoState.endAt - Date.now())/1000));
  updatePomoDisplay(left);
  if(left===0){
    if(pomoState.mode==='focus'){
      completePomodoroFocus();
    } else {
      toast('🍅 休息结束！准备下一轮');
      stopExistingPomo();
      document.getElementById('pomoOverlay')?.remove();
    }
  }
}
function updatePomoDisplay(sec){
  const m=String(Math.floor(sec/60)).padStart(2,'0'), s=String(sec%60).padStart(2,'0');
  const el=document.getElementById('pomoTime'); if(el) el.textContent=`${m}:${s}`;
}
function togglePomoPause(){
  if(!pomoState) return;
  const btn=document.getElementById('pomoPauseBtn');
  if(pomoState.paused){
    pomoState.endAt = Date.now() + pomoState.totalSec*1000;
    pomoState.paused=false; if(btn) btn.textContent='⏸';
  } else {
    pomoState.totalSec = Math.max(0, Math.ceil((pomoState.endAt-Date.now())/1000));
    pomoState.paused=true; if(btn) btn.textContent='▶';
  }
}
function resetPomo(){
  if(!pomoState) return;
  const s=getPomoSettings();
  const sec = pomoState.mode==='focus' ? s.focus*60 : s.break*60;
  pomoState.totalSec=sec; pomoState.endAt=Date.now()+sec*1000; pomoState.paused=false;
  document.getElementById('pomoPauseBtn').textContent='⏸';
  updatePomoDisplay(sec);
}
function completePomodoroFocus(){
  if(!pomoState) return;
  const tasks=LS.get('tasks',[]); const t=tasks.find(i=>i.id===pomoState.taskId);
  if(t){ t.pomodoros=(t.pomodoros||0)+1; if(!t.done) t.done=true; LS.set('tasks',tasks); }
  const s=getPomoSettings();
  const min=Math.max(1, Math.round(s.focus));
  const blocks=LS.get('blocks',[]);
  blocks.push({id:uid(),cat:t?t.cat:'other',title:t?t.title:'番茄专注',min,date:today(),at:nowStr()});
  LS.set('blocks',blocks);
  toast(`🍅 完成一个番茄钟，已计入 ${min} 分钟`);
  // auto start break
  pomoState.mode='break'; pomoState.totalSec=s.break*60; pomoState.endAt=Date.now()+s.break*60000; pomoState.paused=false;
  document.getElementById('pomoMode').textContent='休息中';
  document.querySelector('.pomo-main').textContent='✓';
  document.querySelector('.pomo-main').setAttribute('onclick','stopPomodoro(false)');
  drawTaskBoard(); renderHome();
}
function stopPomodoro(record){
  if(record && pomoState && pomoState.mode==='focus'){
    const elapsed = Math.max(1, Math.round((getPomoSettings().focus*60 - pomoState.totalSec)/60));
    const tasks=LS.get('tasks',[]); const t=tasks.find(i=>i.id===pomoState.taskId);
    if(t){ t.pomodoros=(t.pomodoros||0)+1; if(!t.done) t.done=true; LS.set('tasks',tasks); }
    const blocks=LS.get('blocks',[]);
    blocks.push({id:uid(),cat:t?t.cat:'other',title:t?t.title:'番茄专注',min:elapsed,date:today(),at:nowStr()});
    LS.set('blocks',blocks);
    toast(`已记录 ${elapsed} 分钟专注`);
  }
  stopExistingPomo();
  document.getElementById('pomoOverlay')?.remove();
  drawTaskBoard(); renderHome();
}
function savePomoSettings(){
  const focus = Math.max(1, parseInt(document.getElementById('pomoFocus').value)||25);
  const breakMin = Math.max(1, parseInt(document.getElementById('pomoBreak').value)||5);
  LS.set('pomoSettings',{focus,break:breakMin});
  if(pomoState && !pomoState.paused){
    const s=getPomoSettings();
    pomoState.totalSec = pomoState.mode==='focus' ? s.focus*60 : s.break*60;
    pomoState.endAt = Date.now() + pomoState.totalSec*1000;
    updatePomoDisplay(pomoState.totalSec);
  }
  toast('番茄钟设置已保存');
}
function openPomoSettings(){ renderTasks(); toast('番茄钟设置已显示在顶部标签旁，开始任意任务后可在专注界面调整'); }

/* compute daily totals from real blocks for any date range */
function realDailyTotals(dates){
  const blocks=LS.get('blocks',[]);
  const map={}; dates.forEach(d=>map[d]=0);
  blocks.forEach(b=>{if(map[b.date]!==undefined)map[b.date]+=(b.min||0);});
  return dates.map(d=>({date:d.slice(5),total:map[d]}));
}
function realCatTotals(date){
  const blocks=LS.get('blocks',[]).filter(b=>b.date===date);
  const by={}; CATS.forEach(c=>by[c.id]=0);
  blocks.forEach(b=>by[b.cat]=(by[b.cat]||0)+(b.min||0));
  return by;
}

function renderEfficiency(){
  const byCat=realCatTotals(today());

  const segs=CATS.map(c=>({value:byCat[c.id],color:c.color,label:c.name})).filter(s=>s.value>0);
  const blocks=LS.get('blocks',[]).filter(b=>b.date===today());

  document.getElementById('view-efficiency').innerHTML = `
  <div class="grid cols-3" style="margin-bottom:18px">
    <div class="card stat"><div class="emo">⏱️</div><div class="num">${total}<span style="font-size:14px;color:var(--muted)"> 分</span></div><div class="lbl">今日总投入</div></div>
    <div class="card stat"><div class="emo">🎯</div><div class="num">${bars.length?bars[0].label.slice(0,4):'—'}</div><div class="lbl">今日主攻赛道</div></div>
    <div class="card stat"><div class="emo">📈</div><div class="num">${trend.length?trend[trend.length-1].total:'0'}</div><div class="lbl">今日 vs 近6天</div></div>
  </div>

  ${timer.start?`<div class="card" style="margin-bottom:18px;border-left:4px solid var(--good)">
    <h3>⏱️ 计时中…</h3>
    <p>赛道：<b>${catName(timer.cat)}</b> ｜ 内容：${esc(timer.title||'—')} ｜ 开始于 ${new Date(timer.start).toLocaleTimeString('zh-CN',{hour12:false})}</p>
    <button class="btn" onclick="stopTimer()">⏹ 结束并记录</button>
  </div>`:`<div class="card" style="margin-bottom:18px">
    <h3>⏱️ 快速计时</h3>
    <p class="small muted">选赛道开始计时，结束自动记入今日效率。也可在「任务」里点某条任务的计时按钮。</p>

  </div>`}

  <div class="grid cols-2">
    <div class="card">
      <h3>🥧 今日时间分布 <span class="tag">按赛道</span></h3>
      <div class="chart-wrap">
        <div id="donut"></div>
        <div class="legend" id="donutLeg"></div>
      </div>
      ${total===0?'<p class="small muted" style="margin-top:10px">还没有记录，点上方按钮开始第一次计时。</p>':''}

      <h3>📊 各赛道投入（分钟）</h3>

}
function delBlock(id){LS.set('blocks',LS.get('blocks',[]).filter(b=>b.id!==id));renderEfficiency();renderHome();}

function drawDonut(elId,legId,segs,total){
  const el=document.getElementById(elId); if(!el)return;
  const r=54,cx=70,cy=70,C=2*Math.PI*r;
  if(!segs.length){el.innerHTML='<div class="empty">无数据</div>';document.getElementById(legId).innerHTML='';return;}
  let acc=0; let paths='';
  segs.forEach(s=>{const frac=s.value/total;const dash=frac*C;paths+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="20" stroke-dasharray="${dash} ${C-dash}" stroke-dashoffset="${-acc}" transform="rotate(-90 ${cx} ${cy})"/>`;acc+=dash;});
  el.innerHTML=`<svg width="140" height="140" viewBox="0 0 140 140">${paths}<text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="20" font-weight="800" fill="#3d3842">${total}</text><text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="10" fill="#9b8e9e">分钟</text></svg>`;
  document.getElementById(legId).innerHTML=segs.map(s=>`<div><i style="background:${s.color}"></i>${s.label} · ${s.value}分 (${Math.round(s.value/total*100)}%)</div>`).join('');
}
function drawTrend(elId,data,max){
  const el=document.getElementById(elId); if(!el)return;
  const W=Math.min(680,data.length*90),H=180,pad=30;
  const bw=(W-pad*2)/data.length;
  let bars='';
  data.forEach((d,i)=>{const h=Math.round(Math.max(0,d.total)/max*(H-pad*2));const x=pad+i*bw+bw*0.2;const w=bw*0.6;const y=H-pad-h;
    bars+=`<rect x="${x}" y="${y}" width="${w}" height="${h||1}" rx="6" fill="${i===data.length-1?'url(#g)':'#f0d8df'}"/>`;
    bars+=`<text x="${x+w/2}" y="${y-6}" text-anchor="middle" font-size="11" fill="#9b8e9e">${d.total}</text>`;
    bars+=`<text x="${x+w/2}" y="${H-pad+16}" text-anchor="middle" font-size="11" fill="#9b8e9e">${d.date}</text>`;});
  el.innerHTML=`<svg width="100%" viewBox="0 0 ${W} ${H+10}" preserveAspectRatio="xMidYMid meet">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9919d"/><stop offset="1" stop-color="#aec78e"/></linearGradient></defs>
    <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#e9e4dc"/>
    ${bars}</svg>`;
}

let learnCat='all', learnPlat='all', learnSearch='';
let customItems = LS.get('customLearn',[]);

function renderLearning(){
  const data=window.LEARNING_DATA||[];
  const PLATS=window.PLAT_LIST||["B站","抖音","小红书","微信","网页"];
  const allItems=function(){
    const out={}; data.forEach(c=>out[c.id]=c.items.slice());
    customItems.forEach(ci=>{
      const cid=ci.category||'other-custom';
      if(!out[cid]) out[cid]=[];
      out[cid].push(ci);
    });
    return out;
  }();
  const tabs=`<div class="ltab"><div class="fbtn ${learnCat==='all'?'active':''}" onclick="learnCat='all';renderLearning()">全部板块</div>`+
    data.map(c=>`<div class="fbtn ${learnCat===c.id?'active':''}" onclick="learnCat='${c.id}';renderLearning()">${c.icon} ${c.name}</div>`).join('')+`</div>`;
  const pfilt=`<div class="pfilt"><span class="small muted">平台：</span>`+
    `<div class="fbtn ${learnPlat==='all'?'active':''}" onclick="learnPlat='all';renderLearning()">全部</div>`+
    PLATS.map(p=>`<div class="fbtn ${learnPlat===p?'active':''}" onclick="learnPlat='${p}';renderLearning()">${p}</div>`).join('')+
    `<input class="searchbox" id="learnSearch" placeholder="🔍 搜索资料…" value="${esc(learnSearch)}" oninput="learnSearch=this.value;renderLearning()"></div>`;

  const match=(it)=>{
    if(learnPlat!=='all' && it.plat!==learnPlat) return false;
    if(learnSearch && !(it.name+it.desc+(it.tag||'')).toLowerCase().includes(learnSearch.toLowerCase())) return false;
    return true;
  };

  const catsToShow=learnCat==='all'?data.map(c=>c.id):[learnCat];
  let html=tabs+pfilt;

  /* add form */
  html+=`<div class="ln-add">
    <input id="lnName" placeholder="资料名称" style="min-width:140px">
    <select id="lnPlat">${PLATS.map(p=>`<option>${p}</option>`).join('')}</select>
    <select id="lnCat">${data.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select>
    <input id="lnKw" placeholder="搜索词(可选)" style="max-width:120px">
    <input id="lnUrl" placeholder="链接(可选)" style="max-width:200px">
    <input id="lnTag" placeholder="标签(可选)" style="max-width:100px">
    <button class="btn sm" onclick="addCustomItem()">+ 添加</button>
  </div>`;

  let found=false;
  catsToShow.forEach(cid=>{
    const cat=data.find(c=>c.id===cid);
    if(!cat) return;
    const its=(allItems[cid]||[]).filter(match);
    if(!its.length) return;
    found=true;
    html+=`<div class="lcat"><div class="ic" style="background:${cat.color}">${cat.icon}</div>
      <div><b style="font-size:16px">${cat.name}</b><div class="small muted">${cat.desc} · ${its.length} 项</div></div></div>
    <div class="res-list" style="margin-bottom:22px">
      ${its.map((it,idx)=>resCard2(it,cat)).join('')}
    </div>`;
  });
  if(!found) html+='<div class="empty">没有匹配的资料，换个筛选试试</div>';
  document.getElementById('view-learning').innerHTML=html;
}

function resCard2(it,cat){
  const url = it.url || (window.platSearch?window.platSearch(it.plat,it.kw):'');
  const isCustom=it._custom;
  const platIcon = {B站:'📺', 抖音:'🎵', 小红书:'📕', 微信:'💬', 网页:'🌐'}[it.plat] || '📄';
  const meta = it.type ? `${it.type} · ${it.plat}` : it.plat;
  const kw = it.kw || it.name;

  const douyinUrl = `https://www.douyin.com/search/${encodeURIComponent(kw)}`;
  const biliUrl = `https://search.bilibili.com/all?keyword=${encodeURIComponent(kw)}`;
  const xhsUrl = `https://www.xiaohongshu.com/search_result?keyword=${encodeURIComponent(kw)}`;
  const wxUrl = `https://weixin.sogou.com/weixin?query=${encodeURIComponent(kw)}`;

  return `
    <div class="res-card2">
      <div class="rc-head">
        <span class="plat ${esc(it.plat)}">${esc(it.plat)}</span>
        ${it.type?`<span class="ltag">${esc(it.type)}</span>`:''}
        ${it.tag?`<span class="ltag">#${esc(it.tag)}</span>`:''}
      </div>
      <div class="rc-title">${esc(it.name)}</div>
      <div class="rc-desc">${esc(it.desc||'')}</div>
      <div class="rc-thumb">
        <div class="rc-plat-ico">${platIcon}</div>
        <div class="rc-plat-name">${esc(it.plat)}学习资源</div>
        <div class="rc-meta">${esc(meta)} · 点击对应平台按钮搜索</div>
      </div>
      <div class="rc-actions">
        ${url?`<button class="btn" onclick="window.open('${escAttr(url)}','_blank')">▶ ${it.url?'打开链接':'看教学视频'}</button>`:''}
        ${it.plat!=='B站'?`<button class="btn btn-ghost" onclick="window.open('${escAttr(biliUrl)}','_blank')">B站搜更多</button>`:''}
        ${it.plat!=='抖音'?`<button class="btn btn-ghost" onclick="window.open('${escAttr(douyinUrl)}','_blank')">抖音跟练</button>`:''}
        ${it.plat!=='小红书'?`<button class="btn btn-ghost" onclick="window.open('${escAttr(xhsUrl)}','_blank')">小红书参考</button>`:''}
        ${it.plat!=='微信'?`<button class="btn btn-ghost" onclick="window.open('${escAttr(wxUrl)}','_blank')">微信搜索</button>`:''}
        ${isCustom?`<button class="btn danger" onclick="delCustomItem('${isCustom}')">删除</button>`:''}
      </div>
    </div>`;
}

function addCustomItem(){
  const name=document.getElementById('lnName').value.trim();
  if(!name){toast('填个名称');return;}
  customItems.push({
    _custom:uid(), name,
    type:'自定义', plat:document.getElementById('lnPlat').value,
    category:document.getElementById('lnCat').value,
    kw:document.getElementById('lnKw').value.trim(),
    url:document.getElementById('lnUrl').value.trim(),
    tag:document.getElementById('lnTag').value.trim(),
    desc:''
  });
  LS.set('customLearn',customItems);
  ['lnName','lnKw','lnUrl','lnTag'].forEach(id=>document.getElementById(id).value='');
  renderLearning();
  toast('已添加 ✓');
}
function delCustomItem(id){
  customItems=customItems.filter(it=>it._custom!==id);
  LS.set('customLearn',customItems);
  renderLearning();
  toast('已删除');
}

/* =========================================================
 *  REPORT (导出周报/月报)
 * ========================================================= */
function openReport(){
  let modal=document.createElement('div');
  modal.className='modal-bg';
  modal.id='reportModal';
  let rptHTML='<div class="modal-box"><button class="close" onclick="document.getElementById(\'reportModal\').remove()">×</button>';
  rptHTML+='<h2>📄 导出报告</h2>';
  rptHTML+='<div class="filter" style="margin-bottom:14px"><div class="fbtn active" onclick="switchReport(\'week\')">📅 本周报</div><div class="fbtn" onclick="switchReport(\'month\')">📆 本月报</div></div>';
  rptHTML+=`<div id="rptContent">${buildReport('week')}</div>`;
  rptHTML+='<div style="margin-top:16px;display:flex;gap:10px"><button class="btn" onclick="copyReport()">📋 复制到剪贴板</button><button class="btn ghost" onclick="document.getElementById(\'reportModal\').remove()">关闭</button></div>';
  rptHTML+='</div>';
  modal.innerHTML=rptHTML;
  document.body.appendChild(modal);
  modal.addEventListener('click',e=>{if(e.target===modal)modal.remove();});
}

function switchReport(type){
  document.getElementById('rptContent').innerHTML=buildReport(type);
  document.querySelectorAll('#reportModal .fbtn').forEach((b,i)=>{b.classList.toggle('active',(i===0&&type==='week')||(i===1&&type==='month'));});
}

function buildReport(type){
  const end=today();
  const start=type==='week'?weekStart():monthStart();
  const dates=[];
  let cur=new Date(start);const endD=new Date(end);
  while(cur<=endD){dates.push(fmtDate(cur));cur.setDate(cur.getDate()+1);}
  const blocks=LS.get('blocks',[]);
  const reviews=LS.get('reviews',[]).filter(r=>r.date>=start&&r.date<=end);
  const tasks=LS.get('tasks',[]).filter(t=>t.date>=start&&t.date<=end);

  // daily totals
  const daily={}; dates.forEach(d=>daily[d]=0);
  blocks.forEach(b=>{if(daily[b.date]!==undefined)daily[b.date]+=(b.min||0);});
  const totalMin=Object.values(daily).reduce((a,b)=>a+b,0);
  const daysWith=Object.values(daily).filter(v=>v>0).length;

  // by cat
  const byCat={}; CATS.forEach(c=>byCat[c.id]=0);
  blocks.filter(b=>b.date>=start&&b.date<=end).forEach(b=>byCat[b.cat]=(byCat[b.cat]||0)+(b.min||0));
  const topCat=CATS.map(c=>({name:c.name,val:byCat[c.id]})).sort((a,b)=>b.val-a.val);

  // reviews
  const totalPlay=reviews.reduce((s,r)=>s+(Number(r.play)||0),0);
  const totalLike=reviews.reduce((s,r)=>s+(Number(r.like)||0),0);
  const avgPlay=reviews.length?Math.round(totalPlay/reviews.length):0;
  const avgLike=reviews.length?Math.round(totalLike/reviews.length):0;

  const done=tasks.filter(t=>t.done).length;
  const totalTasks=tasks.length;

  let r=`
  <div class="rp-sect"><h4>📊 概览</h4>
    <p><b>周期：</b>${start} ～ ${end}（${dates.length} 天）</p>
    <p><b>总投入：</b>${totalMin} 分钟（约 ${(totalMin/60).toFixed(1)} 小时）</p>
    <p><b>有记录天数：</b>${daysWith} 天</p>
    <p><b>任务完成：</b>${done}/${totalTasks}</p>
  </div>

  <div class="rp-sect"><h4>🥧 赛道分布</h4>
    ${topCat.filter(c=>c.val>0).map(c=>`<p><b>${c.name}：</b>${c.val} 分（${Math.round(c.val/totalMin*100)}%）</p>`).join('')||'<p class="muted">无记录</p>'}
  </div>

  <div class="rp-sect"><h4>📈 每日投入趋势</h4>
    ${dates.map(d=>`<p>${d.slice(5)}：<b>${daily[d]}</b> 分</p>`).join('')}
  </div>

  <div class="rp-sect"><h4>🔁 内容发布复盘（${reviews.length} 条）</h4>
    <p><b>总播放：</b>${totalPlay.toLocaleString()} · <b>均播放：</b>${avgPlay.toLocaleString()}</p>
    <p><b>总点赞：</b>${totalLike.toLocaleString()} · <b>均点赞：</b>${avgLike.toLocaleString()}</p>
    ${reviews.slice(0,10).map(r=>`<p>· ${r.date} ${r.plat} <b>${esc(r.title)}</b> ▶${(r.play||0).toLocaleString()} ❤${(r.like||0).toLocaleString()}</p>`).join('')}
    ${reviews.length>10?`<p class="muted">…还有 ${reviews.length-10} 条，完整列表见「内容复盘」</p>`:''}
  </div>
  `;
  return r;
}

function copyReport(){
  const content=document.getElementById('rptContent').innerText||document.getElementById('rptContent').textContent;
  navigator.clipboard.writeText(content).then(()=>toast('📋 已复制到剪贴板')).catch(()=>toast('复制失败，请手动选中复制'));
}

renderHome();
